name: Build SafePhone APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradlew
        working-directory: Mohamed_Sabry_Zein_SafePhone
        run: chmod +x gradlew

      - name: Build APK
        working-directory: Mohamed_Sabry_Zein_SafePhone
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafePhone-APK
          path: Mohamed_Sabry_Zein_SafePhone/app/build/outputs/apk/debug/app-debug.apk
