
name: Build SafePhone APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract SafePhone Project
        run: |
          test -f SafePhone_Project_Source_v1_3_1.zip
          mkdir project
          unzip -q SafePhone_Project_Source_v1_3_1.zip -d project

      - name: Build APK
        run: |
          gradle -p project :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafePhone-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
