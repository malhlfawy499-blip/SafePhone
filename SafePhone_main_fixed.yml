name: Build SafePhone APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # GitHub's Ubuntu runner already includes Android SDK command-line tools.
      # Avoid the separate setup-android action that was hanging in the prior run.
      - name: Locate Android SDK
        shell: bash
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -d "/usr/local/lib/android/sdk" ]; then
              echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
              echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
              echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
            else
              echo "Android SDK was not found on this runner." >&2
              exit 1
            fi
          else
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          fi

      - name: Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_HOME:-}" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager was not found. Android SDK setup is incomplete." >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Find and extract the SafePhone source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=""
          while IFS= read -r candidate; do
            if unzip -Z1 "$candidate" 2>/dev/null | grep -qx 'app/build.gradle.kts' \
              && unzip -Z1 "$candidate" 2>/dev/null | grep -qx 'settings.gradle.kts'; then
              ZIP_FILE="$candidate"
              break
            fi
          done < <(find . -maxdepth 3 -type f -name '*.zip' -not -path './.git/*' | sort)

          if [ -z "$ZIP_FILE" ]; then
            echo "Could not find a project ZIP containing app/build.gradle.kts and settings.gradle.kts at its root." >&2
            echo "Upload SafePhone_Project_Source_v1_3_1.zip to the repository root." >&2
            exit 1
          fi

          echo "Using source archive: $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          test -f project/app/build.gradle.kts
          test -f project/settings.gradle.kts
          test -f project/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        shell: bash
        run: gradle -p project :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafePhone-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
