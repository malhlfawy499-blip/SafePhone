name: Build SafePhone APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto Find Project and Build APK
        run: |
          # البحث عن المجلد الذي يحتوي على ملف البناء
          PROJECT_DIR=$(dirname $(find . -name "build.gradle.kts" -o -name "build.gradle" | head -n 1))
          echo "Found project directory at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # إنتاج الـ Wrapper والبناء
          gradle wrapper
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafePhone-APK
          path: '**/build/outputs/apk/debug/*.apk'
